
# Example consumer (validation skill): invalid messages are logged and skipped, unprocessable ones
# (undeserializable, tombstone) go to the dead-letter topic. kafka.bootstrap.servers stays unset on purpose:
# Dev Services starts a broker in dev and test (needs Docker).
mp.messaging.incoming.example-in.connector=smallrye-kafka
mp.messaging.incoming.example-in.topic=example
mp.messaging.incoming.example-in.value.deserializer=@PACKAGE@.feature.example.ExampleMessageDeserializer
mp.messaging.incoming.example-in.fail-on-deserialization-failure=false
mp.messaging.incoming.example-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.example-in.dead-letter-queue.topic=example-dlq
mp.messaging.incoming.example-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.incoming.example-in.auto.offset.reset=earliest
