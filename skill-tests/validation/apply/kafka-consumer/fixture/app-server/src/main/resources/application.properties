# kafka.bootstrap.servers stays unset: Dev Services starts a broker in dev and test (needs Docker).
mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=orders
mp.messaging.incoming.orders-in.value.deserializer=org.acme.shop.feature.order.OrderMessageDeserializer
%test.mp.messaging.incoming.orders-in.auto.offset.reset=earliest
